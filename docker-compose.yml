services:
  postgres:
    image: postgres:16-alpine
    container_name: kadoos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kadoos
      POSTGRES_PASSWORD: kadoos
      POSTGRES_DB: kadoos
    ports:
      - "5432:5432"
    volumes:
      - kadoos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kadoos -d kadoos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kadoos_postgres:
