<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Loading Kadoos" width="120" height="120">
  <title>Loading Kadoos</title>
  <defs>
    <style>
      .ring {
        fill: none;
        stroke: #2c1a12;
        stroke-width: 1.25;
        stroke-linecap: round;
        opacity: 0.18;
      }
      .chair {
        fill: none;
        stroke: #2c1a12;
        stroke-width: 2.25;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 180;
        stroke-dashoffset: 180;
        animation: draw 1.6s ease-in-out infinite alternate, breathe 1.6s ease-in-out infinite;
        transform-origin: 60px 60px;
      }
      .dot {
        fill: #2c1a12;
        opacity: 0;
        animation: fadeDot 1.6s ease-in-out infinite;
      }
      @keyframes draw {
        0% { stroke-dashoffset: 180; opacity: 0.35; }
        55% { stroke-dashoffset: 0; opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 1; }
      }
      @keyframes breathe {
        0%, 100% { transform: scale(0.96); }
        50% { transform: scale(1); }
      }
      @keyframes fadeDot {
        0%, 40% { opacity: 0; }
        70%, 100% { opacity: 0.9; }
      }
      @media (prefers-reduced-motion: reduce) {
        .chair, .dot {
          animation: none;
          stroke-dashoffset: 0;
          opacity: 1;
        }
      }
    </style>
  </defs>

  <circle class="ring" cx="60" cy="60" r="46"/>

  <!-- Stylized chair, centered -->
  <g transform="translate(28,24)">
    <path class="chair" d="
      M 18 28
      V 12
      c 0 -5 5 -9 13 -9
      h 5
      c 8 0 13 4 13 9
      v 5
      h -7
      v -4
      c 0 -2 -2 -4 -6 -4
      s -6 2 -6 4
      V 28
      H 14
      c -3 0 -5 2 -5 4.5
      V 36
      H 16
      M 36 28
      h 8
      c 3 0 5 2 5 4.5
      V 36
      H 40
      M 16 28
      H 40
      M 25 33
      V 48
      M 12 52
      H 44
      c 2 0 3.5 1.2 3.5 2.8
      c 0 1.2 -1.2 2.2 -3.5 2.2
      H 12
      c -2.3 0 -3.5 -1 -3.5 -2.2
      C 8.5 53.2 10 52 12 52
      Z
    "/>
  </g>

  <circle class="dot" cx="60" cy="98" r="2.5"/>
</svg>
